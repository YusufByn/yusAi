[package]
name = "Sinew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop app for Sinew"
default-run = "Sinew"

[lib]
name = "sinew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
sinew-anthropic = { workspace = true }
sinew-app = { workspace = true }
sinew-core = { workspace = true }
sinew-google = { workspace = true }
sinew-kimi = { workspace = true }
sinew-openai = { workspace = true }
sinew-openrouter = { workspace = true }

# Prime Agent engine (vendor/prime-agent)
pa-types = { workspace = true }
pa-ai = { workspace = true }
pa-models = { workspace = true }
pa-agent = { workspace = true }
pa-core = { workspace = true }
pa-daemon = { workspace = true }
# Daemon socket client only (DaemonClient); the TUI itself is never used.
pa-tui = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
directories = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
ring = { workspace = true }
portable-pty = "0.9.0"
reqwest = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

# Updater plugin is desktop-only (Tauri does not ship updater for iOS/Android).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { workspace = true }

[lints]
workspace = true
